name: Backend Continuous Deployment

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-cd.yml"

jobs:

  # =========================================================
  # LINT
  # =========================================================
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: |
          pipenv install --dev

      - name: Run lint
        working-directory: starter/backend
        run: |
          pipenv run lint


  # =========================================================
  # TEST
  # =========================================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: |
          pipenv install --dev

      - name: Run tests
        working-directory: starter/backend
        run: |
          pipenv run test


  # =========================================================
  # BUILD + PUSH + DEPLOY
  # =========================================================
  build-and-deploy:
    needs:
      - lint
      - test

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # AWS CREDENTIALS
      # -----------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}


      # -----------------------------------------------------
      # VERIFY AWS
      # -----------------------------------------------------
      - name: Verify AWS identity
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity


      # -----------------------------------------------------
      # VERIFY EKS CLUSTER
      # -----------------------------------------------------
      - name: Verify EKS cluster
        env:
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
        run: |
          echo "AWS Region: $AWS_REGION"
          echo "EKS Cluster: $EKS_CLUSTER_NAME"

          if [ -z "$AWS_REGION" ]; then
            echo "ERROR: AWS_DEFAULT_REGION secret is empty"
            exit 1
          fi

          if [ -z "$EKS_CLUSTER_NAME" ]; then
            echo "ERROR: EKS_CLUSTER_NAME secret is empty"
            exit 1
          fi

          echo "Checking EKS cluster..."
          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query "cluster.{name:name,status:status,version:version}" \
            --output table


      # -----------------------------------------------------
      # LOGIN TO ECR
      # -----------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # -----------------------------------------------------
      # BUILD + PUSH DOCKER IMAGE
      # -----------------------------------------------------
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.BACKEND_ECR_REPO }}
          IMAGE_TAG: latest

        run: |
          echo "ECR Registry: $ECR_REGISTRY"
          echo "ECR Repository: $ECR_REPOSITORY"

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            starter/backend

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


      # -----------------------------------------------------
      # INSTALL KUSTOMIZE
      # -----------------------------------------------------
      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash

          sudo mv kustomize /usr/local/bin/kustomize

          kustomize version


      # -----------------------------------------------------
      # SETUP KUBECONFIG
      # -----------------------------------------------------
      - name: Set up Kubeconfig for EKS
        env:
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

        run: |
          echo "Updating kubeconfig..."

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

          echo "Testing Kubernetes connection..."

          kubectl cluster-info

          echo "Kubernetes nodes:"
          kubectl get nodes


      # -----------------------------------------------------
      # DEPLOY BACKEND
      # -----------------------------------------------------
      - name: Deploy to Kubernetes via Kustomize
        working-directory: starter/backend/k8s
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.BACKEND_ECR_REPO }}

        run: |
          echo "Updating backend image..."

          kustomize edit set image \
            backend="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Generated Kubernetes manifests:"
          kustomize build .

          echo "Applying Kubernetes manifests..."

          kustomize build . | kubectl apply -f -


      # -----------------------------------------------------
      # VERIFY DEPLOYMENT
      # -----------------------------------------------------
      - name: Verify Kubernetes deployment
        run: |

          echo "Waiting for backend deployment..."

          kubectl rollout status \
            deployment/backend \
            --timeout=180s

          echo ""
          echo "======================================"
          echo "KUBERNETES RESOURCES"
          echo "======================================"

          kubectl get all

          echo ""
          echo "======================================"
          echo "BACKEND DEPLOYMENT"
          echo "======================================"

          kubectl get deployment backend

          echo ""
          echo "======================================"
          echo "BACKEND PODS"
          echo "======================================"

          kubectl get pods -o wide

          echo ""
          echo "======================================"
          echo "BACKEND SERVICE"
          echo "======================================"

          kubectl get service


      # -----------------------------------------------------
      # VERIFY ECR IMAGE
      # -----------------------------------------------------
      - name: Verify Backend ECR image
        env:
          ECR_REPOSITORY: ${{ secrets.BACKEND_ECR_REPO }}

        run: |

          echo "======================================"
          echo "ECR IMAGE DETAILS"
          echo "======================================"

          AWS_PAGER="" aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag=latest \
            --query "imageDetails[0].{Repository:repositoryName,Tag:imageTags[0],Digest:imageDigest,PushedAt:imagePushedAt}" \
            --output table
